<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expense">
  <title>Quick Add · Finance</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page quick-page">
  <div class="auth-card">
    <div class="quick-head">
      <div class="logo-title">Log Expense</div>
      <span class="muted">{{ display_name }}</span>
    </div>

    <div class="book-toggle" role="group" aria-label="Book">
      <button type="button" data-book="personal" class="active">Personal</button>
      <button type="button" data-book="family">Family</button>
    </div>

    <form id="quick-form">
      <label for="q-amount">Amount</label>
      <div class="cur-toggle" role="group" aria-label="Currency">
        <button type="button" data-cur="USD">$ USD</button>
        <button type="button" data-cur="EUR">€ EUR</button>
        <button type="button" data-cur="INR">₹ INR</button>
        <button type="button" data-cur="DKK">kr DKK</button>
      </div>
      <input id="q-amount" class="quick-amount" type="text" inputmode="decimal" placeholder="0.00" required autofocus>
      <div id="q-fx" class="quick-fx"></div>
      <label for="q-cat">Category</label>
      <select id="q-cat"></select>
      <label for="q-notes">Notes</label>
      <input id="q-notes" placeholder="e.g. Chipotle">
      <label for="q-date">Date</label>
      <input id="q-date" type="date">
      <button class="btn btn-red" type="submit" id="q-submit">Add Expense</button>
    </form>
    <div id="q-status" class="quick-status" role="status"></div>

    <div class="section-title" style="margin-top:20px">Recent</div>
    <div id="q-recent"></div>

    <div class="quick-foot"><a href="/">Open full dashboard →</a></div>
  </div>

<script>
'use strict';
let info = null;
let book = localStorage.getItem('quickBook') === 'family' ? 'family' : 'personal';
let currency = 'USD';
try { currency = localStorage.getItem('quickCurrency') || 'USD'; } catch (e) {}
let fx = null;  // {rates: {CUR: per 1 USD}, date, stale}
const SYM = { USD: '$', EUR: '€', INR: '₹', DKK: 'kr' };
const money = (n, cur) => cur === 'DKK' ? `${Number(n).toFixed(2)} kr` : `${SYM[cur] || cur + ' '}${Number(n).toFixed(2)}`;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const r = await fetch('/api/quick-info');
  if (r.status === 401) { location.href = '/login?next=/quick'; return; }
  info = await r.json();
  if (!$('q-date').value) $('q-date').value = info.today;
  render();
}

async function loadRates() {
  try {
    const r = await fetch('/api/fx-rates');
    const res = await r.json();
    fx = res.ok ? res : null;
  } catch (e) { fx = null; }
  renderFx();
}

// Live "≈ $x" preview; the server converts with the rate for the expense's date.
function renderFx() {
  document.querySelectorAll('.cur-toggle button').forEach(b => b.classList.toggle('active', b.dataset.cur === currency));
  const el = $('q-fx');
  if (currency === 'USD') { el.textContent = ''; return; }
  if (!fx) { el.textContent = 'Exchange rate unavailable right now; it will be looked up when you save.'; return; }
  const perUsd = fx.rates[currency];
  const amt = parseFloat($('q-amount').value.replace(/,/g, '')) || 0;
  const rate = `1 ${currency} = $${(1 / perUsd).toFixed(currency === 'INR' ? 5 : 4)} · ECB ${fx.date}${fx.stale ? ' (offline, last known)' : ''}`;
  el.textContent = amt > 0 ? `≈ $${(amt / perUsd).toFixed(2)}  ·  ${rate}` : rate;
}

function render() {
  document.querySelectorAll('.book-toggle button').forEach(b => b.classList.toggle('active', b.dataset.book === book));
  const b = info.books[book];
  const cur = $('q-cat').value;
  $('q-cat').innerHTML = b.categories.map(c => `<option>${esc(c)}</option>`).join('');
  if (b.categories.includes(cur)) $('q-cat').value = cur;
  $('q-recent').innerHTML = b.recent.length ? b.recent.map(e => `
    <div class="quick-row">
      <div><div>${esc(e.category)}${e.notes ? ' · ' + esc(e.notes) : ''}</div>
      <div class="muted" style="font-size:12px">${esc(e.date)}${book === 'family' && e.added_by ? ' · ' + esc(e.added_by) : ''}</div></div>
      <div style="color:var(--red);text-align:right">${e.currency ? `${money(e.original_amount, e.currency)}<div class="muted" style="font-size:12px">≈ $${Number(e.amount).toFixed(2)}</div>` : '$' + Number(e.amount).toFixed(2)}</div>
    </div>`).join('') : '<div class="muted">Nothing yet.</div>';
}

document.querySelectorAll('.book-toggle button').forEach(btn => btn.addEventListener('click', () => {
  book = btn.dataset.book;
  try { localStorage.setItem('quickBook', book); } catch (e) {}
  render();
}));

document.querySelectorAll('.cur-toggle button').forEach(btn => btn.addEventListener('click', () => {
  currency = btn.dataset.cur;
  try { localStorage.setItem('quickCurrency', currency); } catch (e) {}
  renderFx();
  $('q-amount').focus();
}));
$('q-amount').addEventListener('input', renderFx);

$('quick-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('q-submit').disabled = true;
  const status = $('q-status');
  try {
    const r = await fetch('/api/quick-add', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ book, currency, amount: $('q-amount').value, category: $('q-cat').value,
                             notes: $('q-notes').value, date: $('q-date').value }),
    });
    if (r.status === 401) { location.href = '/login?next=/quick'; return; }
    const res = await r.json();
    status.className = 'quick-status ' + (res.ok ? 'ok' : 'err');
    status.textContent = res.ok ? '✓ ' + res.message : res.error;
    if (res.ok) { $('q-amount').value = ''; $('q-notes').value = ''; await load(); renderFx(); }
  } catch (e) {
    status.className = 'quick-status err';
    status.textContent = 'Could not reach the server.';
  } finally {
    $('q-submit').disabled = false;
  }
});

renderFx();
load();
loadRates();
</script>
</body>
</html>
